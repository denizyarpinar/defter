<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Defter Kitaplığı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one isometric study-room diorama fills the screen; a CSS-3D camera moves between
   room → bookcase → desk; reading happens in a 2D open-book overlay on the desk surface. */
:root{
  color-scheme: light;
  --ui:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --hand:'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;

  --wallUser:#efe6d8;           /* customisable */
  --floorA:#d9a46a; --floorB:#c48d55;
  --ink:#2a231d;                 /* text on paper */
  --paper:#fbf7ef; --paperEdge:#eadfca;
  --brass:#c9a35a;
  --accent:#b5523b;              /* terracotta-red ribbon / pen colour */
  --navy:#1f3352;

  /* day values */
  --stageA:#efe2cb; --stageB:#d8c3a2;
  --wall:var(--wallUser);
  --sky1:#bfdcf2; --sky2:#f6ecd9;
  --night:rgba(16,22,48,0);
  --glow:0; --sun:1; --nb:1;
  --chrome:rgba(255,251,244,.86); --chromeFg:#2a231d; --chromeLine:rgba(60,40,20,.14);
  --desk:#7a5a3f; --desk2:#5e4430; --frameC:#fbf8f3;
}
#app[data-mode="night"]{
  --stageA:#22314f; --stageB:#0e1527;
  --wall:color-mix(in srgb, var(--wallUser) 62%, #2a3150);
  --sky1:#0d1630; --sky2:#26365c;
  --night:rgba(14,20,46,.36);
  --glow:1; --sun:0; --nb:.66;
  --chrome:rgba(22,28,46,.82); --chromeFg:#efe7da; --chromeLine:rgba(255,255,255,.12);
  --desk:#4b3726; --desk2:#2f2218; --frameC:#b9b4ad;
}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:#d8c3a2; font-family:var(--ui); color:var(--chromeFg); overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
#app{position:fixed; inset:0; background:radial-gradient(120% 90% at 50% 40%, var(--stageA), var(--stageB)); transition:background .8s}
button,label.btn{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,label.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- top bar ---------- */
.bar{color:var(--chromeFg); position:fixed; left:0; right:0; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px; pointer-events:none}
.bar > *{pointer-events:auto}
.brand{font-family:var(--serif); font-style:italic; font-weight:600; font-size:26px; letter-spacing:.01em; line-height:1}
.crumb{display:flex; gap:6px; align-items:center; font-size:13px; opacity:.75; flex-wrap:wrap}
.crumb button{background:none; border:0; padding:2px 4px; border-radius:6px}
.crumb button:hover{background:var(--chromeLine)}
.spacer{flex:1}
.seg{display:flex; background:var(--chrome); border:1px solid var(--chromeLine); border-radius:999px; padding:3px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.seg button{border:0; background:none; padding:6px 11px; border-radius:999px; font-size:13px; font-weight:500; white-space:nowrap}
.seg button.on{background:var(--chromeFg); color:var(--stageB)}
.pill{color:var(--chromeFg); background:var(--chrome); border:1px solid var(--chromeLine); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.hint{color:var(--chromeFg); position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); transform:translateX(-50%); z-index:15; font-size:13px;
  background:var(--chrome); border:1px solid var(--chromeLine); padding:8px 14px; border-radius:999px; white-space:nowrap; max-width:calc(100vw - 32px); overflow:hidden; text-overflow:ellipsis;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
#toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 64px); transform:translate(-50%,-12px); opacity:0; z-index:60; pointer-events:none;
  background:#221c17; color:#f5ede0; padding:10px 16px; border-radius:12px; font-size:13.5px; max-width:min(520px, calc(100vw - 32px)); line-height:1.4;
  transition:opacity .25s, transform .25s; box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- 3D stage ---------- */
#stage{position:absolute; inset:0; overflow:hidden; touch-action:none}
#stage canvas{display:block; touch-action:none}
#loading{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font:italic 600 22px var(--serif); color:var(--chromeFg); opacity:.7; pointer-events:none}
#world{position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
  transition:transform 1.15s cubic-bezier(.62,0,.24,1)}
#world.instant{transition:none}
.g{position:absolute; left:0; top:0; width:0; height:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d}
.pl{position:absolute; left:0; top:0; transform-origin:0 0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  box-shadow:inset 0 0 0 4000px var(--night); overflow:hidden}
.pl.both{backface-visibility:visible; -webkit-backface-visibility:visible}
.sh-front{box-shadow:inset 0 0 0 4000px rgba(30,15,0,.07), inset 0 0 0 4000px var(--night)}
.sh-right{box-shadow:inset 0 0 0 4000px rgba(30,15,0,.20), inset 0 0 0 4000px var(--night)}
.sh-left{box-shadow:inset 0 0 0 4000px rgba(30,15,0,.14), inset 0 0 0 4000px var(--night)}
.bb{box-shadow:none; filter:brightness(var(--nb))}

/* room */
.floor{background:
  repeating-linear-gradient(90deg, rgba(70,35,5,.16) 0 1.5px, transparent 1.5px 62px),
  repeating-linear-gradient(0deg, rgba(255,240,220,.05) 0 3px, transparent 3px 11px),
  linear-gradient(135deg, var(--floorA), var(--floorB))}
.wallface{background:var(--wall); transition:background .8s}
.walledge{background:#fbf8f3}
.slabedge{background:linear-gradient(#c79462,#a87445)}
.sunpatch{background:rgba(255,236,186,.42); opacity:var(--sun); transition:opacity .8s; box-shadow:none}
.rug{border-radius:50%; background:radial-gradient(closest-side, #efe5d6 0 70%, #e2d4bf 71% 74%, #efe5d6 75%)}
.shadow{background:radial-gradient(closest-side, rgba(40,22,5,.32), rgba(40,22,5,0)); box-shadow:none}
#app[data-mode="night"] .shadow{background:radial-gradient(closest-side, rgba(0,0,0,.5), rgba(0,0,0,0))}

.window{position:absolute; border:9px solid var(--frameC); box-shadow:0 2px 0 rgba(0,0,0,.06), inset 0 0 0 1px rgba(0,0,0,.05);
  background:linear-gradient(180deg, var(--sky1), var(--sky2)); display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:7px; transition:background .8s}
.window i{border:0; box-shadow:inset 0 0 0 7px var(--frameC); display:block}
.window .moon{position:absolute; width:26px; height:26px; border-radius:50%; right:34px; top:34px; background:#f4ecd2; box-shadow:0 0 22px rgba(244,236,210,.6); opacity:calc(1 - var(--sun))}
.window .stars{position:absolute; inset:0; opacity:calc(1 - var(--sun)); background:
  radial-gradient(1.4px 1.4px at 20% 30%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 64% 18%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 42% 62%, #fff 50%, transparent 51%), radial-gradient(1.3px 1.3px at 82% 70%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 12% 80%, #fff 50%, transparent 51%)}
.sill{position:absolute; height:10px; background:#fbf8f3; box-shadow:0 4px 6px rgba(0,0,0,.08)}
.frame{position:absolute; background:#fff; border:5px solid #2d2620; box-shadow:0 6px 10px rgba(0,0,0,.12); filter:brightness(var(--nb)); overflow:hidden}
.plan{font:600 8px/1.2 var(--ui); color:#3b332b; padding:5px; display:grid; grid-template-columns:repeat(5,1fr); gap:2px}
.plan b{grid-column:1/-1; font:700 9px var(--serif); letter-spacing:.02em}
.plan span{background:#f1ebe2; height:14px; border-radius:2px; font-size:5.5px; padding:1px; overflow:hidden}
.plan span.a{background:#cfe0ef}.plan span.c{background:#f2d5c9}.plan span.d{background:#d9e6cf}
.art{background:linear-gradient(160deg,#f3ece2 0 55%, #d7b28a 55% 70%, #2f4a63 70%)}
.clock{position:absolute; width:62px; height:62px; border-radius:50%; background:#fbf8f3; border:4px solid #2d2620; box-shadow:0 5px 10px rgba(0,0,0,.14); filter:brightness(var(--nb))}
.clock i{position:absolute; left:50%; bottom:50%; width:2px; background:#2d2620; transform-origin:50% 100%; border-radius:2px}
.clock .hh{height:15px; width:3px; margin-left:-1.5px}.clock .mm{height:22px; margin-left:-1px}
.clock::after{content:''; position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px; border-radius:50%; background:var(--accent)}
.wallglow{position:absolute; border-radius:50%; background:radial-gradient(closest-side, rgba(255,196,120,.55), rgba(255,196,120,0)); opacity:var(--glow); transition:opacity .8s}
.deskglow{border-radius:50%; background:radial-gradient(closest-side, rgba(255,205,135,.75), rgba(255,205,135,0)); opacity:var(--glow); box-shadow:none; transition:opacity .8s}
.floorglow{border-radius:50%; background:radial-gradient(closest-side, rgba(255,190,110,.32), rgba(255,190,110,0)); opacity:var(--glow); box-shadow:none; transition:opacity .8s}
.lampshade{transition:fill .8s}

/* bookcase */
.wood{background:linear-gradient(90deg, #5d3524, #6a3d29 40%, #57311f)}
.woodtop{background:linear-gradient(#6f4430,#5a3424)}
.woodback{background:linear-gradient(180deg, #2f1a12, #3e2418 30%, #3a2116)}
.case-hit{cursor:pointer}
.plate{display:flex; align-items:center; justify-content:center; font:700 6.4px/1 var(--ui); letter-spacing:.14em; text-transform:uppercase; color:#3b2a12;
  background:linear-gradient(180deg,#e7cd8b,#b88e45); border-radius:1.5px; box-shadow:0 1px 1px rgba(0,0,0,.35); white-space:nowrap; filter:brightness(var(--nb))}

/* books */
.bk{transition:transform .5s cubic-bezier(.5,0,.2,1); cursor:pointer}
.bk.fly{transition:transform 1.1s cubic-bezier(.62,0,.24,1)}
.bk.pull{transition:transform .38s cubic-bezier(.3,0,.2,1)}
.bk.drag{transition:none}
.spine{display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:4px 0 3px; box-sizing:border-box}
.spine .t{writing-mode:vertical-rl; font:700 7px/1 var(--ui); letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-height:calc(100% - 18px)}
.spine .c{font:700 5.6px/1 var(--ui); letter-spacing:.08em; opacity:.85}
.spine.leather .t{font:700 8.6px/1 var(--serif); text-transform:none; letter-spacing:.02em}
.spine::before,.spine::after{content:''; position:absolute; left:0; right:0; height:1.5px; background:var(--band)}
.spine::before{top:6px}.spine::after{bottom:11px}
.cover{background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px)}
.pagetop{background:repeating-linear-gradient(90deg, #f3ead6 0 1px, #e7dbc1 1px 2px); box-shadow:inset 0 0 0 1.5px var(--bc), inset 0 0 0 4000px var(--night)}
.dusty .pl{filter:saturate(.45) brightness(1.13) contrast(.92)}
.dusty .spine{background-image:radial-gradient(rgba(255,255,255,.25) 0.6px, transparent 0.8px) !important; background-size:4px 4px !important}
.ribbon{position:absolute; left:50%; bottom:-1px; width:3px; height:12px; margin-left:-1.5px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.bk:hover .spine{outline:1px solid rgba(255,255,255,.55); outline-offset:-1px}
#app[data-view="room"] .bk:hover .spine{outline:none}

/* ---------- side panel ---------- */
#panel{position:fixed; right:12px; top:calc(env(safe-area-inset-top,0px) + 62px); bottom:12px; width:min(340px, calc(100vw - 24px)); z-index:30;
  background:var(--chrome); color:var(--chromeFg); border:1px solid var(--chromeLine); border-radius:18px; padding:16px; box-sizing:border-box; overflow:auto;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 20px 50px rgba(0,0,0,.18); user-select:text; -webkit-user-select:text}
#panel h3{margin:18px 0 8px; font:600 11px/1 var(--ui); letter-spacing:.12em; text-transform:uppercase; opacity:.65}
#panel h3:first-of-type{margin-top:4px}
.prow{display:flex; gap:8px; align-items:center; margin-bottom:6px}
.prow input[type=text]{flex:1; min-width:0; font:500 14px var(--ui); padding:7px 10px; border-radius:9px; border:1px solid var(--chromeLine); background:rgba(255,255,255,.55); color:#2a231d}
.prow .n{font:600 12px var(--ui); width:18px; opacity:.6; font-variant-numeric:tabular-nums}
.ibtn{border:1px solid var(--chromeLine); background:transparent; border-radius:9px; padding:6px 9px; font-size:12.5px}
.ibtn.danger{color:#b23a2a; border-color:rgba(178,58,42,.35)}
.ibtn.solid{background:var(--chromeFg); color:var(--stageB); border-color:transparent; font-weight:600}
.sw{display:flex; flex-wrap:wrap; gap:7px}
.sw button{width:28px; height:28px; border-radius:7px; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button.on{border-color:var(--chromeFg)}
#panel select{width:100%; font:500 14px var(--ui); padding:7px 9px; border-radius:9px; border:1px solid var(--chromeLine); background:rgba(255,255,255,.55); color:#2a231d; margin-bottom:8px}
.note{font-size:12px; opacity:.7; line-height:1.45; margin:6px 0 0}
.phead{display:flex; align-items:center; justify-content:space-between}
.phead b{font:600 20px var(--serif)}

/* ---------- reader ---------- */
#reader{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
  background:
   radial-gradient(70% 60% at 22% 4%, rgba(255,214,150,calc(.16 + var(--glow)*.30)), transparent 70%),
   radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.38)),
   linear-gradient(rgba(10,14,30,calc(var(--glow)*.38)), rgba(10,14,30,calc(var(--glow)*.38))),
   var(--deskImg, none) center / 1100px auto,
   linear-gradient(180deg, var(--desk), var(--desk2));
  opacity:0; transition:opacity .35s}
#reader.show{opacity:1}
.r-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px; color:#f5ecdf}
.r-top .rb{border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.18); border-radius:10px; padding:7px 11px; font-size:13px; font-weight:500; color:#f5ecdf; white-space:nowrap}
.r-top .rb.on{background:#f5ecdf; color:#2a231d; border-color:transparent}
.r-top .rb[aria-disabled="true"]{opacity:.55}
.r-title{flex:1; min-width:140px; line-height:1.15}
.r-title b{display:block; font:600 20px var(--serif)}
.r-title span{font-size:12.5px; opacity:.75}
.r-seg{display:flex; background:rgba(0,0,0,.22); border-radius:10px; padding:3px}
.r-seg button{border:0; background:none; color:#f5ecdf; padding:5px 11px; border-radius:8px; font-size:13px}
.r-seg button.on{background:#f5ecdf; color:#2a231d}
.r-tools{display:flex; gap:8px; align-items:center; justify-content:center; padding:0 16px 6px; flex-wrap:wrap}
.r-tools button{border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.22); color:#f5ecdf; border-radius:9px; padding:6px 10px; font-size:12.5px}
.r-tools button.on{background:#f5ecdf; color:#2a231d}
.r-tools .dot{width:22px; height:22px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.35)}
.r-tools .dot.on{border-color:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.r-body{flex:1; position:relative; min-height:0}
#spreadWrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none}
#zoom{perspective:2400px; transform-origin:50% 50%; will-change:transform}
#zoom.anim{transition:transform .28s cubic-bezier(.3,0,.2,1)}
.zoomed #spreadWrap{cursor:grab}
.r-bottom .zm{display:flex; align-items:center; gap:2px; border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.18); border-radius:10px; padding:2px}
.r-bottom .zm button{border:0; background:none; color:#f5ecdf; width:32px; height:32px; border-radius:8px; font-size:18px; line-height:1}
.r-bottom .zm span{min-width:46px; text-align:center; font-size:12.5px; font-variant-numeric:tabular-nums; cursor:pointer}
#spread{position:relative; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.62,0,.24,1)}
#spread::before{content:''; position:absolute; inset:-7px -9px; border-radius:6px; background:linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,.04) 50%, rgba(0,0,0,.18)), var(--bookc,#24476b); box-shadow:0 26px 50px rgba(0,0,0,.38), 0 3px 0 rgba(0,0,0,.25); transition:opacity .4s}
#spread.closed::before{left:calc(50% - 9px)}
#spread::after{content:''; position:absolute; top:0; bottom:0; left:calc(50% - 22px); width:44px; pointer-events:none; z-index:3;
  background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.16) 45%, rgba(0,0,0,.24) 50%, rgba(0,0,0,.16) 55%, rgba(0,0,0,0))}
#spread.single::after,#spread.closed::after{display:none}
.slot{position:absolute; top:0; height:100%; transition:opacity .45s}
.page{position:absolute; inset:0; background:var(--paperImg, none) var(--paper); color:var(--ink); overflow:hidden; container-type:inline-size; box-shadow:inset 0 0 0 1px rgba(80,60,30,.08)}
.page .in{position:absolute; inset:0; padding:7cqw 8cqw 9cqw; box-sizing:border-box; font-size:3.05cqw; line-height:1.5; display:flex; flex-direction:column}
.page .folio{position:absolute; bottom:3.6cqw; left:0; right:0; text-align:center; font:500 2.5cqw var(--ui); letter-spacing:.08em; opacity:.5; font-variant-numeric:tabular-nums}
.page .in > *{flex-shrink:0}
.page .src svg{width:2.6cqw; height:2.6cqw; flex:none}
.page .src{display:flex; align-items:center; gap:1.6cqw; font:600 2.3cqw/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; opacity:.6; margin-bottom:4cqw}
.page h2{font:600 7cqw/1.05 var(--serif); margin:0 0 3cqw; text-wrap:balance}
.page h4{font:700 2.5cqw/1 var(--ui); letter-spacing:.12em; text-transform:uppercase; margin:2cqw 0 1.5cqw; color:#7a5a3f}
.page p{margin:0 0 2.4cqw}
.page ul{margin:0 0 2.4cqw; padding-left:4.5cqw}
.page li{margin-bottom:1cqw}
.page pre{font:400 2.55cqw/1.55 var(--mono); background:#f1eadc; border-left:2px solid #c9b590; padding:2.4cqw 3cqw; margin:0 0 2.6cqw; white-space:pre; overflow:hidden}
.page table{border-collapse:collapse; font-size:2.7cqw; margin-bottom:2.6cqw; width:100%}
.page td,.page th{border-bottom:1px solid #e4d8c2; padding:1cqw 1.4cqw; text-align:left}
.page th{font-weight:700}
.page .badge{display:inline-flex; align-items:center; gap:1cqw; padding:.8cqw 2cqw; border-radius:99px; background:#efe1f7; color:#5a2f7a; font:700 2.2cqw var(--ui); letter-spacing:.06em; text-transform:uppercase; align-self:flex-start; margin-bottom:3cqw}
.page.leftp{box-shadow:inset -18px 0 26px -18px rgba(0,0,0,.18)}
.page.rightp{box-shadow:inset 18px 0 26px -18px rgba(0,0,0,.18)}
.ink{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.penmode .ink{pointer-events:auto; touch-action:none; cursor:crosshair}

/* title page */
.tp .in{justify-content:center; text-align:center; align-items:center}
.tp .shelf{font:600 2.4cqw var(--ui); letter-spacing:.2em; text-transform:uppercase; opacity:.55; margin-bottom:5cqw}
.tp h1{font:600 7.4cqw/1.05 var(--serif); margin:0 0 3cqw; text-wrap:balance; overflow-wrap:anywhere; hyphens:auto}
.tp .sub{font:italic 500 4.4cqw var(--serif); opacity:.75; margin-bottom:8cqw}
.tp .meta{display:grid; grid-template-columns:auto auto; gap:1.4cqw 4cqw; font-size:2.8cqw; text-align:left}
.tp .meta dt{opacity:.55}.tp .meta dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums}
.tp .exl{margin-top:10cqw; font:500 3.6cqw var(--hand); opacity:.7}
.tp .go{margin-top:5cqw; border:1px solid #c9b590; background:none; border-radius:99px; padding:1.6cqw 4cqw; font:600 2.7cqw var(--ui); color:var(--ink)}

/* toc */
.toc h2{margin-bottom:5cqw}
.toc ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1.2cqw}

.toc .legend{margin-top:auto; font-size:2.3cqw; opacity:.6; padding-top:3cqw}

.photo .in{padding:6cqw; justify-content:center}

.paper{background:

.inside{background:repeating-linear-gradient(45deg, #e8dcc4 0 6px, #e2d4b8 6px 12px)}

/* cover */
.coverface{position:absolute; inset:0; background-color:var(--bookc); color:#f6ecd8; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; container-type:inline-size;

/* leaf (page turn) */
.leaf{position:absolute; top:0; height:100%; transform-style:preserve-3d; z-index:5; transition:transform .82s cubic-bezier(.45,.05,.2,1)}
.leaf.fw{transform-origin:0 50%; transform:rotateY(0deg)}
.leaf.fw.go{transform:rotateY(-180deg)}
.leaf.bw{transform-origin:100% 50%; transform:rotateY(0deg)}
.leaf.bw.go{transform:rotateY(180deg)}
.leaf.slow{transition-duration:1.05s}
.lf{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.lf.back{transform:rotateY(180deg)}
.lf::after{content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg, rgba(0,0,0,.0), rgba(0,0,0,.18)); opacity:0; transition:opacity .41s}
.leaf.go .lf.front::after{opacity:1}
/* single page turn */
.single-turn{transition:transform .5s cubic-bezier(.5,0,.2,1), opacity .5s; transform-origin:0 50%}
.single-turn.out-l{transform:rotateY(-70deg); opacity:0}
.single-turn.out-r{transform:rotateY(70deg) translateX(30%); opacity:0}

/* photo notes on a page */
.stickers{position:absolute; inset:0; pointer-events:none}
.sticker{position:absolute; margin:0; background:#fff; padding:1.1cqw 1.1cqw 2.6cqw; box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.04); pointer-events:auto; touch-action:none; cursor:grab}
.sticker img{display:block; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none}

.c-stage{overflow:hidden}

/* =========================================================
   REALISTIC 3D ROOM (three.js) — same logic, physically lit scene
   world coords from the plan: x → right, y → toward viewer, z → up (cm-ish)
   three coords: X = x, Y = z, Z = y  (×0.01)
   ========================================================= */
const $ = s => document.querySelector(s);
const app = $('#app'), stage = $('#stage');
function el(tag, cls, parent, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; if(parent) parent.appendChild(e); return e; }

const U = 0.01, V3 = THREE.Vector3;
const P = (x,y,z) => new V3(x*U, z*U, y*U);
let renderer, scene, camera;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const ENV_MATS = [];
const OWN = new WeakSet();
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function std(o){ const m = new THREE.MeshStandardMaterial(o); ENV_MATS.push(m); return m; }
function hex2rgb(h){ const v = hexRgb(h); return v; }
function mixHex(a, b, k){ const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v,i) => Math.round(v + (B[i]-v)*k)).join(',')})`; }

function canvas(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
function tex(c, rep, srgb = true){
  const t = new THREE.CanvasTexture(c);
  if(srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if(rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function noise(g, w, h, amt, seed){
  const r = mulberry(seed || 5), id = g.getImageData(0,0,w,h), d = id.data;
  for(let i=0;i<d.length;i+=4){ const n = (r()-.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(id,0,0);
}
function drawWood(g, w, h, base, dark, seed, lines){
  const r = mulberry(seed);
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for(let i=0;i<(lines||160);i++){
    const y0 = r()*h, amp = 1.5 + r()*7, fr = (0.6 + r()*2.4) * Math.PI*2 / w, ph = r()*6;
    g.strokeStyle = dark; g.globalAlpha = 0.035 + r()*0.11; g.lineWidth = 0.5 + r()*2.2;
    g.beginPath();
    for(let x=0;x<=w;x+=6){ const y = y0 + Math.sin(x*fr + ph)*amp + Math.sin(x*fr*3.3 + ph*2)*amp*.25; x ? g.lineTo(x,y) : g.moveTo(x,y); }
    g.stroke();
  }
  // a few knots
  for(let k=0;k<3;k++){ const cx = r()*w, cy = r()*h; g.globalAlpha = .12; g.fillStyle = dark; g.beginPath(); g.ellipse(cx, cy, 10 + r()*14, 3 + r()*4, 0, 0, 7); g.fill(); }
  g.globalAlpha = 1; noise(g, w, h, 12, seed + 1);
}
const TEX = {};
function woodTex(kind, rot){
  const key = kind + (rot ? 'v' : 'h');
  if(TEX[key]) return TEX[key];
  const pal = { walnut:['#6b3f2a','#2b140b'], oak:['#d9bd96','#8a6038'], light:['#efe6d8','#b49a78'] }[kind];
  const t = tex(canvas(1024, 1024, (g,w,h) => drawWood(g,w,h,pal[0],pal[1], kind.length*7)), [1,1]);
  if(rot){ t.center.set(.5,.5); t.rotation = Math.PI/2; }
  return TEX[key] = t;
}
function floorTex(a, b){
  return tex(canvas(1024, 1024, (g,w,h) => {
    const r = mulberry(11), rows = 7, ph = h/rows;
    for(let i=0;i<rows;i++){
      let x = -r()*w*0.6;
      while(x < w){
        const L = w*(0.42 + r()*0.5);
        g.fillStyle = mixHex(a, b, r()); g.fillRect(x, i*ph, L, ph);
        for(let k=0;k<22;k++){
          g.strokeStyle = `rgba(70,35,10,${0.04 + r()*0.09})`; g.lineWidth = 0.5 + r()*1.4;
          const yy = i*ph + 3 + r()*(ph-6), f = 0.006 + r()*0.02, p2 = r()*6;
          g.beginPath(); for(let xx=Math.max(x,0); xx<Math.min(x+L,w); xx+=8) g.lineTo(xx, yy + Math.sin(xx*f + p2)*2.2); g.stroke();
        }
        g.fillStyle = 'rgba(45,22,6,.45)'; g.fillRect(x+L-2, i*ph, 2, ph);
        x += L;
      }
      g.fillStyle = 'rgba(45,22,6,.38)'; g.fillRect(0, i*ph, w, 2);
    }
    noise(g, w, h, 10, 12);
  }), [2.2, 2.2]);
}
function plasterTex(){
  if(TEX.plaster) return TEX.plaster;
  return TEX.plaster = tex(canvas(512, 512, (g,w,h) => {
    g.fillStyle = '#f4f2ee'; g.fillRect(0,0,w,h);
    const r = mulberry(3);
    for(let i=0;i<60;i++){ g.fillStyle = `rgba(${r()<.5?255:200},${r()<.5?250:195},${r()<.5?245:190},.05)`; g.beginPath(); g.arc(r()*w, r()*h, 20 + r()*70, 0, 7); g.fill(); }
    noise(g, w, h, 7, 4);
  }), [4, 3]);
}
function clothNoise(seed){
  if(TEX['cloth'+seed]) return TEX['cloth'+seed];
  return TEX['cloth'+seed] = tex(canvas(256, 256, (g,w,h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h);
    g.globalAlpha = .07; g.fillStyle = '#000';
    for(let y=0;y<h;y+=2) g.fillRect(0,y,w,1);
    for(let x=0;x<w;x+=2) g.fillRect(x,0,1,h);
    g.globalAlpha = 1; noise(g, w, h, 22, seed);
  }), [2, 2]);
}

/* ---------- geometry helpers ---------- */
function rbox(w, h, d, r){
  r = Math.max(0.0005, Math.min(r, w/2 - 1e-4, h/2 - 1e-4, d/2 - 1e-4));
  const s = new THREE.Shape(), x = -w/2 + r, y = -h/2 + r, ww = w - 2*r, hh = h - 2*r;
  s.moveTo(x,y); s.lineTo(x+ww,y); s.lineTo(x+ww,y+hh); s.lineTo(x,y+hh); s.lineTo(x,y);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(1e-4, d - 2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:3 });
  g.translate(0, 0, -(d - 2*r)/2); g.computeVertexNormals();
  return g;
}
function add(mesh, parent, cast = true, recv = true){ mesh.castShadow = cast; mesh.receiveShadow = recv; (parent || scene).add(mesh); return mesh; }
// box from plan coords: min corner (x,y,z) and size (sx,sy,sz); r = bevel in plan units
function boxAt(x,y,z, sx,sy,sz, mat, parent, r){
  const geo = r ? rbox(sx*U, sz*U, sy*U, r*U) : new THREE.BoxGeometry(sx*U, sz*U, sy*U);
  const m = new THREE.Mesh(geo, mat); m.position.copy(P(x + sx/2, y + sy/2, z + sz/2));
  return add(m, parent);
}
function cylBetween(a, b, rad, mat, parent){
  const dir = new V3().subVectors(b, a), len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, len, 16), mat);
  m.position.copy(a).addScaledVector(dir, .5);
  m.quaternion.setFromUnitVectors(new V3(0,1,0), dir.normalize());
  return add(m, parent);
}
function leafGeo(len, wid, bend, cup){
  const s = new THREE.Shape();
  s.moveTo(0,0); s.bezierCurveTo(wid, len*.18, wid*.9, len*.7, 0, len); s.bezierCurveTo(-wid*.9, len*.7, -wid, len*.18, 0, 0);
  const g = new THREE.ShapeGeometry(s, 10), p = g.attributes.position;
  for(let i=0;i<p.count;i++){ const x = p.getX(i), y = p.getY(i); p.setZ(i, bend * Math.pow(y/len, 2) * len + Math.abs(x) * (cup || .35)); }
  g.computeVertexNormals(); return g;
}

function potPlant(R, x, y, z, s, kind){
  const g = new THREE.Group(); g.position.copy(P(x, y, z)); R.add(g);
  const r = mulberry(Math.round(x + y));
  const ph = kind === 'small' ? 0.12 : 0.5 * s, rt = kind === 'small' ? 0.07 : 0.3 * s;
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(rt, rt*0.78, ph, 40), kind === 'snake' ? M.darkCeramic : M.ceramic); pot.position.y = ph/2; add(pot, g);
  const soil = new THREE.Mesh(new THREE.CircleGeometry(rt*0.92, 32), M.soil); soil.rotation.x = -Math.PI/2; soil.position.y = ph - 0.02; g.add(soil);
  if(kind === 'snake'){
    for(let i=0;i<9;i++){
      const len = 0.9 + r()*0.8, m = new THREE.Mesh(leafGeo(len, 0.075, 0.05, .9), M.snake);
      m.position.set((r()-.5)*0.25, ph - 0.02, (r()-.5)*0.25); m.rotation.set(-(r()-.5)*0.35, r()*Math.PI*2, (r()-.5)*0.3, 'YXZ'); add(m, g);
    }
  } else {
    const n = kind === 'small' ? 7 : 26, L = kind === 'small' ? 0.16 : 0.62 * s;
    for(let i=0;i<n;i++){
      const stemLen = (kind === 'small' ? 0.05 : 0.5*s) * (0.4 + r()*0.9), yaw = r()*Math.PI*2, tilt = 0.35 + r()*0.9;

/* =========================================================
   TWEENS + CAMERA
   ========================================================= */
const tweens = [];
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
function tween(dur, fn, done, key){
  if(key) for(let i=tweens.length-1;i>=0;i--) if(tweens[i].key === key) tweens.splice(i,1);
  const tw = { t0: performance.now(), dur, fn, done, key }; tweens.push(tw); dirty = true; return tw;
}
function runTweens(now){
  for(let i=tweens.length-1;i>=0;i--){
    const tw = tweens[i]; const k = Math.min(1, (now - tw.t0)/tw.dur);
    tw.fn(ease(k), k);
    if(k >= 1){ tweens.splice(i,1); tw.done && tw.done(); }
  }
}
function animTo(g, toPos, toQ, dur, arc, done){
  const fp = g.position.clone(), fq = g.quaternion.clone();
  tween(dur, k => { g.position.lerpVectors(fp, toPos, k); if(arc) g.position.y += Math.sin(Math.PI*k)*arc; THREE.Quaternion.slerp(fq, toQ, g.quaternion, k); }, done, 'b:' + g.userData.bookId);
}
let view = 'room';
const camTarget = new V3();
function viewParams(v){
  const aspect = innerWidth/innerHeight, vf = camera.fov*Math.PI/180;
  const hf = 2*Math.atan(Math.tan(vf/2)*aspect);
  const useV = (innerHeight - 130)/innerHeight;
  const fit = (halfW, halfH) => Math.max(halfH/Math.tan(vf*useV/2), halfW/Math.tan(hf/2));
  if(v === 'room'){
    const tgt = new V3(5.1, 1.55, 4.2), dir = new V3(1, 0.86, 1.08).normalize();
    return { tgt, pos: tgt.clone().addScaledVector(dir, fit(aspect < 0.8 ? 7.4 : 6.5, 5.6)) };
  }
  if(v === 'shelf'){
    const bh = BH()*U, tgt = new V3((BX + BW/2)*U, bh/2, BD*U);
    const d = fit((BW + 60)*U/2, bh*0.56);
    return { tgt, pos: tgt.clone().add(new V3(0, d*0.1, d)) };
  }
  if(v === 'desk'){
    const tgt = DESK_SPOT.clone().add(new V3(0, 0.02, 0)), dir = new V3(1, 1.5, 0.12).normalize();
    return { tgt, pos: tgt.clone().addScaledVector(dir, fit(0.65, 0.55)) };
  }
}
const DESK_SPOT = P(78, 412, 146);
function setView(v, instant, dur){
  view = v; app.dataset.view = v;
  const p = viewParams(v);
  if(instant){ camera.position.copy(p.pos); camTarget.copy(p.tgt); camera.lookAt(camTarget); dirty = true; }
  else {
    const fp = camera.position.clone(), ft = camTarget.clone();
    tween(dur || 1150, k => { camera.position.lerpVectors(fp, p.pos, k); camTarget.lerpVectors(ft, p.tgt, k); camera.lookAt(camTarget); }, null, 'cam');
  }
  updateChrome();
}

function setLighting(night, instant){

/* =========================================================
   POINTER: tap to zoom / open, drag to move books
   ========================================================= */
let press = null;
function setRay(e){ const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1); ray.setFromCamera(ndc, camera); }
function pick(){
  const objs = [caseGroup, ...Object.values(bookGroups)];
  const hits = ray.intersectObjects(objs, true);
  for(const h of hits){ if(h.object.userData.bookId) return { book: h.object.userData.bookId }; if(h.object.userData.case) return { case:true }; }
  return null;
}
function onDown(e){
  if(R.book || e.button > 0) return;
  setRay(e); const hit = pick();
  press = { x:e.clientX, y:e.clientY, hit, id: hit && hit.book, drag:false, pid:e.pointerId };
  try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){}
}
function onMove(e){
  if(!press){
    if(R.book || e.pointerType !== 'mouse') return;
    setRay(e); const h = pick(); renderer.domElement.style.cursor = h ? 'pointer' : 'default'; return;
  }
  if(press.pid !== e.pointerId) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if(!press.drag && view === 'shelf' && press.id && Math.hypot(dx, dy) > 8){
    press.drag = true; const g = bookGroups[press.id];
    press.plane = new THREE.Plane(new V3(0,0,1), -((BD - 31)*U + 0.35));
    setRay(e); const pt = new V3(); ray.ray.intersectPlane(press.plane, pt);
    press.off = new V3(g.position.x - pt.x, g.position.y - pt.y, 0);
    press.p0 = Object.assign({}, pos[press.id]);
    tween(1, () => {}, null, 'b:' + press.id);
  }
  if(press.drag){
    setRay(e); const pt = new V3();
    if(ray.ray.intersectPlane(press.plane, pt)){
      const g = bookGroups[press.id];
      g.position.set(pt.x + press.off.x, pt.y + press.off.y, (BD - 31)*U + 0.35); dirty = true;
    }
  }
}
function onUp(e){
  if(!press || press.pid !== e.pointerId) return;
  const p = press; press = null;
  if(p.drag){ dropBook(p); return; }
  if(view === 'room'){ if(p.hit) goShelf(); return; }
  if(view === 'shelf'){ if(p.id) openBook(p.id); else if(!p.hit) goRoom(); }
}
function dropBook(p){
  const g = bookGroups[p.id], info = p.p0, n = S.shelves.length;
  const zc = g.position.y / U;               // centre height in plan units
  const fromBottom = Math.max(0, Math.min(n-1, Math.floor((zc - BASE) / SH)));
  const target = n - 1 - fromBottom;
  const from = S.shelves[info.shelf];
  from.books.splice(from.books.indexOf(p.id), 1);
  const xc = g.position.x / U;
  const list = S.shelves[target].books;
  let at = 0; for(const id of list){ if(pos[id].x + pos[id].t/2 < xc) at++; }
  list.splice(at, 0, p.id);
  layout(); save();
  if(target !== info.shelf) toast(`“${BOOKS[p.id].title}” → ${S.shelves[target].name} rafına taşındı`);
}

/* ---------- open / close: book flies to the desk ---------- */
function openBook(id){
  if(R.book) return;
  R.book = id; R.hist = []; away.add(id);
  const g = bookGroups[id], c = centerOf(pos[id]);

function closeBook(){

/* customisation hooks */
function refreshBook(id){

  const p = old.position.clone(), q = old.quaternion.clone();
  disposeGroup(old); const g = bookGroups[id] = makeBook(id); g.position.copy(p); g.quaternion.copy(q); dirty = true;

function rebuildCase(){ save(); buildCase(); buildBooks(); setView(view, true); }
const floorCache = {};
function applyRoom(){
  if(!M.wall) return;

  const f = FLOOR_SWATCHES[S.room.floor] || FLOOR_SWATCHES[0];

/* ---------- render loop ---------- */
let lastRender = 0;
function loop(now){
  requestAnimationFrame(loop);
  const active = tweens.length > 0;
  runTweens(now);
  if(R.book && reader.classList.contains('show') && !active) return;   // the reader covers the scene
  if(!active && !dirty && now - lastRender < 1000) return;
  renderer.render(scene, camera); lastRender = now; dirty = false;
}
function initThree(){
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

/* =========================================================
   READER
   ========================================================= */
const PAGE_AR = 1.4142; // A4, same as a PDF page
const R = { book:null, pages:[], idx:0, mode:'book', pen:false, tool:S.prefs.tool, color:S.prefs.color, size:S.prefs.size, hlColor:S.prefs.hlColor, hlSize:S.prefs.hlSize, busy:false, single:false, hist:[], placing:null };
const spread = $('#spread'), reader = $('#reader');
let sawPen = false;

function buildPages(id){
  const b = BOOKS[id]; const pages = [{ kind:'title', key:id+':title' }, { kind:'toc', key:id+':toc' }];
  b.chapters.forEach((c, ci) => {
    c.start = pages.length;
    c.src.forEach((s, si) => {
      for(let n=0;n<s.n;n++) pages.push({ kind: s.k === 'note' ? 'note' : s.k === 'link' ? 'link' : 'pdf', src:s, ch:ci, n, key:`${id}:${ci}:${si}:${n}` });
    });
    (PHOTOS[id] && PHOTOS[id][ci] || []).forEach(ph => pages.push({ kind:'photo', ch:ci, img:ph.data, key:ph.key, when:ph.when }));
  });
  return pages;
}

function geometry(){
  const vw = innerWidth, vh = innerHeight;
  const topH = reader.querySelector('.r-top').offsetHeight + (R.pen ? reader.querySelector('.r-tools').offsetHeight : 0);
  const botH = reader.querySelector('.r-bottom').offsetHeight;
  const avH = vh - topH - botH - 34;
  R.single = vw < 760 || !!S.prefs.single;
  const pw = R.single ? Math.min(vw - 40, avH/PAGE_AR) : Math.min((vw - 60)/2, avH/PAGE_AR);
  return { pw: Math.max(140, Math.floor(pw)) };
}
function layoutSpread(){
  const { pw } = geometry(); R.pw = pw;
  spread.style.width = (R.single ? pw : pw*2) + 'px';
  spread.style.height = Math.round(pw*PAGE_AR) + 'px';
  spread.classList.toggle('single', R.single);
  spread.style.setProperty('--bookc', book(R.book).color);
}
function slot(side){
  let s = spread.querySelector('.slot.' + side);
  if(!s){ s = el('div','slot ' + side, spread); }
  s.style.width = R.pw + 'px'; s.style.left = (side === 'r' && !R.single ? R.pw : 0) + 'px';
  return s;
}
function fill(side, i){
  const s = slot(side); s.innerHTML = '';
  const pg = R.pages[i];
  const node = pg ? renderPage(pg, i, side) : renderEnd(side);
  s.appendChild(node); paintInk(node);
}
function renderAll(){
  layoutSpread();
  spread.querySelectorAll('.slot').forEach(s => s.remove());
  if(R.single){ fill('l', R.idx); }
  else { fill('l', R.idx); fill('r', R.idx + 1); }
  updateReaderChrome();
}

function showReader(id){
  const b = book(id);
  R.pages = buildPages(id); R.idx = 0; R.mode = 'book'; setPen(false);
  $('#rBook').textContent = b.title; reader.hidden = false;
  R.zoom = 1; R.panX = 0; R.panY = 0; R.pz = 1; $('#pdfView').style.setProperty('--pz', 1); applyZoom(false);
  $('#singleBtn').textContent = S.prefs.single ? 'Çift sayfa' : 'Tek sayfa'; $('#singleBtn').hidden = innerWidth < 760;
  reader.querySelectorAll('#rMode button').forEach(x => x.classList.toggle('on', x.dataset.m === 'book'));
  $('#pdfView').hidden = true; $('#spreadWrap').hidden = false;
  requestAnimationFrame(() => {
    reader.classList.add('show');
    layoutSpread();
    spread.innerHTML = '';
    // closed cover sitting on the right half, then it opens
    if(R.single){ fill('l', 0); updateReaderChrome(); coverOpenSingle(b); return; }
    fill('l', 0); fill('r', 1);
    const L = spread.querySelector('.slot.l'); L.style.opacity = '0';
    spread.classList.add('closed'); spread.style.transition = 'none';
    spread.style.transform = `translateX(${-R.pw/2}px)`;
    const leaf = el('div','leaf fw slow', spread); leaf.style.left = R.pw + 'px'; leaf.style.width = R.pw + 'px';
    const fr = el('div','lf front', leaf), bk = el('div','lf back', leaf);
    fr.appendChild(coverFace(b));
    const tp = renderPage(R.pages[0], 0, 'l'); bk.appendChild(tp); paintInk(tp);
    updateReaderChrome();
    spread.offsetWidth; spread.style.transition = '';
    setTimeout(() => {
      spread.classList.remove('closed');
      spread.style.transform = 'translateX(0)';
      leaf.classList.add('go');
      setTimeout(() => { L.style.opacity = '1'; }, 520);
      setTimeout(() => { leaf.remove(); }, 1120);
    }, 260);
  });
}
function coverOpenSingle(b){
  const s = spread.querySelector('.slot.l');
  const c = el('div','slot', spread); c.style.width = R.pw + 'px'; c.style.left = 0; c.style.zIndex = 6; c.className = 'slot single-turn';
  c.appendChild(coverFace(b));
  setTimeout(() => { c.classList.add('out-l'); setTimeout(() => c.remove(), 520); }, 450);
}
function coverFace(b){
  const f = el('div','coverface');
  f.style.setProperty('--bookc', b.color);
  f.style.color = b.style === 'leather' ? '#e6c77f' : (isDark(b.color) ? '#f6ecd8' : '#2a231d');
  f.innerHTML = `<div class="cs">${esc(b.ders)}</div><div class="rule"></div><div class="ct">${esc(b.title)}</div><div class="rule"></div><div class="cs">${esc(b.code)}</div>`;
  return f;
}

function flipTo(target){
  if(R.mode !== 'book') return;
  const step = R.single ? 1 : 2;
  target = Math.max(0, Math.min(target, R.pages.length - 1));
  if(!R.single) target -= target % 2;
  if(R.busy || target === R.idx) return;
  if(R.pen){ toast('Kalem modundayken sayfa sabit. Çevirmek için kalemi kapat.'); return; }
  const dir = target > R.idx ? 1 : -1;
  R.busy = true;
  if(R.single){
    const old = spread.querySelector('.slot.l'); old.classList.add('single-turn'); old.classList.remove('l'); old.style.zIndex = 6;
    fill('l', target); R.idx = target; updateReaderChrome();
    requestAnimationFrame(() => old.classList.add(dir > 0 ? 'out-l' : 'out-r'));
    setTimeout(() => { old.remove(); R.busy = false; }, 520);
    return;
  }
  const cur = R.idx;
  const leaf = el('div','leaf ' + (dir > 0 ? 'fw' : 'bw'), spread);
  leaf.style.width = R.pw + 'px'; leaf.style.left = (dir > 0 ? R.pw : 0) + 'px';
  const fr = el('div','lf front', leaf), bk = el('div','lf back', leaf);
  const a = dir > 0 ? renderPageOrEnd(cur + 1, 'r') : renderPageOrEnd(cur, 'l');
  const b = dir > 0 ? renderPageOrEnd(target, 'l') : renderPageOrEnd(target + 1, 'r');
  fr.appendChild(a); bk.appendChild(b);
  if(dir > 0) fill('r', target + 1); else fill('l', target);
  requestAnimationFrame(() => { paintInk(a); paintInk(b); requestAnimationFrame(() => leaf.classList.add('go')); });
  const done = () => { if(!leaf.isConnected) return; if(dir > 0) fill('l', target); else fill('r', target + 1); leaf.remove(); R.idx = target; R.busy = false; updateReaderChrome(); };
  setTimeout(done, 860);
}
function renderPageOrEnd(i, side){ return R.pages[i] ? renderPage(R.pages[i], i, side) : renderEnd(side); }
function renderEnd(side){ const p = el('div','page endp ' + (side === 'r' ? 'rightp' : 'leftp')); el('div','in',p,'Son sayfa'); return p; }

function chapterOf(i){ const pg = R.pages[i]; return pg && pg.ch !== undefined ? pg.ch : null; }
function updateReaderChrome(){
  const n = R.pages.length;
  const a = R.idx + 1, b = Math.min(n, R.idx + (R.single ? 1 : 2));
  $('#pno').textContent = R.single || a === b ? `s. ${a} / ${n}` : `s. ${a}–${b} / ${n}`;
  const ci = chapterOf(R.single ? R.idx : R.idx + 1) ?? chapterOf(R.idx);

/* ---------- ink (pen / highlighter / eraser) ----------
   Strokes are stored as normalised points [x, y, pressure, t] and drawn as a smooth,
   filled outline (variable width) instead of short line segments, so they look like ink. */
const PEN_SIZES = [1.3, 2.5, 4.6], HL_SIZES = [12, 18, 26];
const PEN_COLORS = [['#1d3a8a','Lacivert'],['#222222','Siyah'],['#b5523b','Kırmızı'],['#2f7a46','Yeşil']];
const HL_COLORS = [['#f5d33a','Sarı'],['#8fd16a','Yeşil'],['#f59ac0','Pembe'],['#8ec5f2','Mavi'],['#f6b26b','Turuncu']];
function paintInk(node){
  const cv = node.querySelector('canvas.ink'); if(!cv) return;
  const r = cv.getBoundingClientRect(); const w = cv.clientWidth || r.width, h = cv.clientHeight || r.height;
  if(!w || !h){ requestAnimationFrame(() => paintInk(node)); return; }
  let dpr = (devicePixelRatio || 1) * (R.mode === 'pdf' ? 1 : (R.zoom || 1));
  dpr = Math.min(dpr, Math.sqrt(11e6 / (w*h)));
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); cv._dpr = dpr;
  paintInkSameSize(cv);
}
function smoothPts(pts, w, h){
  // light streamlining removes jitter from touch / mouse input
  const out = []; let last = null;
  for(const p of pts){
    const q = [p[0]*w, p[1]*h, p[2], p[3] || 0];
    if(!last){ last = q; out.push(q); continue; }
    last = [last[0] + (q[0]-last[0])*0.55, last[1] + (q[1]-last[1])*0.55, q[2], q[3]];
    const o = out[out.length-1];
    if(Math.hypot(last[0]-o[0], last[1]-o[1]) > 0.75) out.push(last);
  }
  const e = pts[pts.length-1]; const end = [e[0]*w, e[1]*h, e[2], e[3] || 0];
  const o = out[out.length-1]; if(Math.hypot(end[0]-o[0], end[1]-o[1]) > 0.3) out.push(end);
  return out;
}
function penOutline(pts, base, realPressure){
  // per-point radius: real pencil pressure, or a simulated one from speed (fast = thinner)
  const n = pts.length, rad = new Array(n);
  let pr = .55, total = 0; const lens = [0];
  for(let i=1;i<n;i++){ total += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); lens.push(total); }
  for(let i=0;i<n;i++){
    let target;
    if(realPressure) target = pts[i][2];
    else { const d = i ? Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]) : 0; target = Math.max(.25, Math.min(.85, .82 - d/(base*7))); }
    pr += (target - pr) * (realPressure ? .6 : .28);
    const taperIn = Math.min(1, .45 + lens[i]/(base*5)), taperOut = Math.min(1, .45 + (total - lens[i])/(base*5));
    rad[i] = base * (.42 + pr*.95) * Math.min(taperIn, taperOut) / 2;
  }
  const L = [], Rr = [];
  for(let i=0;i<n;i++){
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1]; const len = Math.hypot(dx,dy) || 1; dx /= len; dy /= len;
    L.push([pts[i][0] - dy*rad[i], pts[i][1] + dx*rad[i]]);
    Rr.push([pts[i][0] + dy*rad[i], pts[i][1] - dx*rad[i]]);
  }
  return { L, R: Rr, rad };
}
function curveThrough(ctx, arr, start){
  if(start) ctx.moveTo(arr[0][0], arr[0][1]); else ctx.lineTo(arr[0][0], arr[0][1]);
  for(let i=1;i<arr.length-1;i++){ const mx = (arr[i][0]+arr[i+1][0])/2, my = (arr[i][1]+arr[i+1][1])/2; ctx.quadraticCurveTo(arr[i][0], arr[i][1], mx, my); }
  if(arr.length > 1) ctx.lineTo(arr[arr.length-1][0], arr[arr.length-1][1]);
}
function drawStroke(ctx, s, w, h){
  if(!s.p.length) return;
  const k = w / 600;
  const pts = smoothPts(s.p, w, h);
  ctx.save();
  if(s.t === 'hl'){
    ctx.globalAlpha = .38; ctx.globalCompositeOperation = 'multiply';
    ctx.strokeStyle = s.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = (s.sz || 18) * k;
    ctx.beginPath(); curveThrough(ctx, pts, true); if(pts.length === 1) ctx.lineTo(pts[0][0] + .1, pts[0][1]); ctx.stroke();
  } else {
    const base = (s.sz || 2.4) * k * 1.25;
    ctx.fillStyle = s.c;
    if(pts.length < 3){ ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], base*.45, 0, Math.PI*2); ctx.fill(); if(pts.length === 2){ ctx.beginPath(); ctx.arc(pts[1][0], pts[1][1], base*.45, 0, Math.PI*2); ctx.fill(); } }
    else {
      const o = penOutline(pts, base, !!s.real);
      ctx.beginPath();
      curveThrough(ctx, o.L, true);
      const e = pts[pts.length-1], re = o.rad[o.rad.length-1];
      const ang = Math.atan2(o.L[o.L.length-1][1]-e[1], o.L[o.L.length-1][0]-e[0]);
      ctx.arc(e[0], e[1], re, ang, ang + Math.PI, true);
      curveThrough(ctx, o.R.slice().reverse(), false);
      const b0 = pts[0], r0 = o.rad[0];
      const ang0 = Math.atan2(o.R[0][1]-b0[1], o.R[0][0]-b0[0]);
      ctx.arc(b0[0], b0[1], r0, ang0, ang0 + Math.PI, true);
      ctx.closePath(); ctx.fill();
    }
  }

}
function straightenHL(s){
  // a highlighter stroke that is roughly horizontal snaps to a clean straight line
  if(s.t !== 'hl' || s.p.length < 3) return;
  const xs = s.p.map(p => p[0]), ys = s.p.map(p => p[1]);
  const dx = Math.max(...xs) - Math.min(...xs), dy = (Math.max(...ys) - Math.min(...ys)) * PAGE_AR;
  if(dx > 0.06 && dy < dx * 0.18){
    const y = ys.reduce((a,b) => a+b, 0) / ys.length, a = s.p[0], b = s.p[s.p.length-1];
    s.p = [[a[0], y, .5, 0], [b[0], y, .5, 0]];
  }
}
function bindInk(cv){
  let cur = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height, e.pointerType === 'pen' ? (e.pressure || .5) : .5, e.timeStamp]; };
  cv.addEventListener('pointerdown', e => {
    if(e.pointerType === 'pen') sawPen = true;
    if(!R.pen) return;
    if(e.pointerType === 'touch' && sawPen) return;          // palm rejection once a pencil is seen
    if(Z.pinch) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const key = cv.dataset.key;
    if(R.tool === 'er'){ cur = { er:true, key }; erase(cv, pt(e)); return; }
    const hl = R.tool === 'hl';
    cur = { key, s:{ t:R.tool, c: hl ? R.hlColor : R.color, sz: hl ? HL_SIZES[R.hlSize] : PEN_SIZES[R.size], real: e.pointerType === 'pen', p:[pt(e)] } };
    // snapshot of what is already on the page, so only the live stroke is redrawn while writing
    const bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height; bg.getContext('2d').drawImage(cv, 0, 0); cur.bg = bg;
    (S.ink[key] = S.ink[key] || []).push(cur.s); R.hist.push(key);
    const mine = cur;
    liveStroke = { cancel(){ const l = S.ink[key]; const i = l.indexOf(mine.s); if(i >= 0) l.splice(i,1); R.hist.pop(); if(cur === mine) cur = null; paintInkSameSize(cv); } };
    drawLive(cv, cur);
  });
  cv.addEventListener('pointermove', e => {
    if(!cur) return;
    if(Z.pinch){ cancelLiveStroke(); return; }
    if(cur.er){ erase(cv, pt(e)); return; }
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const ev of (evs.length ? evs : [e])) cur.s.p.push(pt(ev));
    drawLive(cv, cur);
  });
  const end = () => { liveStroke = null; if(!cur) return; if(cur.s){ straightenHL(cur.s); paintInkSameSize(cv); } cur = null; save(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function drawLive(cv, cur){
  const ctx = cv.getContext('2d'), dpr = cv._dpr || 1;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(cur.bg, 0, 0);
  ctx.setTransform(dpr,0,0,dpr,0,0); drawStroke(ctx, cur.s, cv.clientWidth, cv.clientHeight);
}
function paintInkSameSize(cv){
  const ctx = cv.getContext('2d'), dpr = cv._dpr || 1, w = cv.clientWidth, h = cv.clientHeight;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const s of (S.ink[cv.dataset.key] || [])) drawStroke(ctx, s, w, h);
}
function erase(cv, p){
  const list = S.ink[cv.dataset.key]; if(!list) return;
  const before = list.length;
  S.ink[cv.dataset.key] = list.filter(s => !s.p.some(q => Math.hypot(q[0]-p[0], (q[1]-p[1])*PAGE_AR) < 0.022));
  if(S.ink[cv.dataset.key].length !== before) paintInkSameSize(cv);
}
function renderTools(){
  const t = $('#rTools'), hl = R.tool === 'hl';
  const colors = hl ? HL_COLORS : PEN_COLORS, cur = hl ? R.hlColor : R.color, sizes = hl ? [6,10,15] : [3,5,8], si = hl ? R.hlSize : R.size;
  t.innerHTML = `<button data-tool="pen" class="${R.tool==='pen'?'on':''}">Kalem</button><button data-tool="hl" class="${hl?'on':''}">Fosforlu</button><button data-tool="er" class="${R.tool==='er'?'on':''}">Silgi</button>
    <span class="sep"></span>
    ${R.tool === 'er' ? '<span style="font-size:12.5px;opacity:.75">Silmek için çizginin üzerinden geç</span>' :
      colors.map(([c,n]) => `<button class="dot ${c===cur?'on':''}" data-color="${c}" style="background:${c}" aria-label="${n}" title="${n}"></button>`).join('') +
      '<span class="sep"></span>' +
      sizes.map((d,i) => `<button class="sz ${i===si?'on':''}" data-size="${i}" aria-label="${['İnce','Orta','Kalın'][i]}" title="${['İnce','Orta','Kalın'][i]}"><i style="width:${hl?d*1.6:d}px;height:${d}px;${hl?'border-radius:2px;':''}"></i></button>`).join('')}
    <span class="sep"></span><button id="undo">Geri al</button>`;
}
function savePen(){ Object.assign(S.prefs, { tool:R.tool === 'er' ? S.prefs.tool : R.tool, color:R.color, size:R.size, hlColor:R.hlColor, hlSize:R.hlSize }); save(); }
function undo(){
  const key = R.hist.pop(); if(!key || !S.ink[key]) return;
  S.ink[key].pop(); save();
  document.querySelectorAll(`canvas.ink[data-key="${CSS.escape(key)}"]`).forEach(paintInkSameSize);
}

/* ---------- photo notes (cropped photo placed on a page) ---------- */
function renderStickers(p, key){
  const layer = el('div','stickers',p);
  for(const st of (STICK[key] || [])) layer.appendChild(stickerEl(st, key, p));
}
function stickerEl(st, key, page){
  const f = el('figure','sticker');
  f.style.left = st.x*100 + '%'; f.style.top = st.y*100 + '%'; f.style.width = st.w*100 + '%';
  f.style.transform = `rotate(${st.rot || 0}deg)`;
  f.innerHTML = `<img alt="Defter fotoğrafı" src="${st.src}"><button class="x" aria-label="Fotoğrafı kaldır">×</button><button class="rs" aria-label="Boyutlandır">⤡</button>`;
  let drag = null;
  f.addEventListener('pointerdown', e => {
    if(R.pen) return;
    e.stopPropagation(); e.preventDefault();
    document.querySelectorAll('.sticker.sel').forEach(x => x !== f && x.classList.remove('sel'));
    f.classList.add('sel');
    if(e.target.closest('.x')){ STICK[key] = (STICK[key] || []).filter(x => x.id !== st.id); saveStick(); f.remove(); toast('Fotoğraf notu kaldırıldı.'); return; }
    const r = page.getBoundingClientRect();
    drag = { mode: e.target.closest('.rs') ? 'size' : 'move', x:e.clientX, y:e.clientY, st0:{...st}, pw:r.width, ph:r.height };
    f.setPointerCapture(e.pointerId);
  });
  f.addEventListener('pointermove', e => {
    if(!drag) return;
    const dx = (e.clientX - drag.x)/drag.pw, dy = (e.clientY - drag.y)/drag.ph;
    if(drag.mode === 'move'){ st.x = Math.max(-.1, Math.min(.95, drag.st0.x + dx)); st.y = Math.max(-.05, Math.min(.95, drag.st0.y + dy)); f.style.left = st.x*100 + '%'; f.style.top = st.y*100 + '%'; }
    else { st.w = Math.max(.15, Math.min(1, drag.st0.w + dx)); f.style.width = st.w*100 + '%'; }
  });
  const up = () => { if(drag){ drag = null; saveStick(); } };
  f.addEventListener('pointerup', up); f.addEventListener('pointercancel', up);
  return f;
}
document.addEventListener('pointerdown', e => { if(!e.target.closest('.sticker')) document.querySelectorAll('.sticker.sel').forEach(x => x.classList.remove('sel')); });

/* placing: after cropping, the next tap on a page drops the photo there */
function startPlacing(src, ar){
  R.placing = { src, ar }; reader.classList.add('placing');
  toast('Fotoğrafı koymak istediğin yere dokun.');
}
reader.addEventListener('pointerdown', e => {
  if(!R.placing) return;
  const page = e.target.closest('.page'); if(!page || !page.dataset.key || page.closest('.leaf')) return;
  e.stopPropagation(); e.preventDefault();

/* crop dialog */
const CR = { img:null, rot:0, box:null, scale:1, ox:0, oy:0, iw:0, ih:0 };
function openCrop(dataURL){
  const im = new Image();
  im.onload = () => { CR.src = im; CR.rot = 0; $('#crop').hidden = false; requestAnimationFrame(layoutCrop); };
  im.src = dataURL;
}
function rotatedCanvas(){
  const im = CR.src, rot = CR.rot % 360, swap = rot === 90 || rot === 270;
  const c = document.createElement('canvas'); c.width = swap ? im.naturalHeight : im.naturalWidth; c.height = swap ? im.naturalWidth : im.naturalHeight;
  const g = c.getContext('2d'); g.translate(c.width/2, c.height/2); g.rotate(rot*Math.PI/180); g.drawImage(im, -im.naturalWidth/2, -im.naturalHeight/2);
  return c;
}
function layoutCrop(){
  const stg = $('#cStage'), img = $('#cImg');
  const rc = rotatedCanvas(); CR.canvas = rc;
  img.src = rc.toDataURL('image/jpeg', .9);
  const W2 = stg.clientWidth, H2 = stg.clientHeight;
  CR.scale = Math.min(W2/rc.width, H2/rc.height);
  CR.iw = rc.width*CR.scale; CR.ih = rc.height*CR.scale; CR.ox = (W2 - CR.iw)/2; CR.oy = (H2 - CR.ih)/2;
  Object.assign(img.style, { left:CR.ox+'px', top:CR.oy+'px', width:CR.iw+'px', height:CR.ih+'px' });
  CR.box = { x:CR.ox + CR.iw*.1, y:CR.oy + CR.ih*.1, w:CR.iw*.8, h:CR.ih*.8 };
  drawCropBox();
}
function drawCropBox(){ const b = CR.box; Object.assign($('#cBox').style, { left:b.x+'px', top:b.y+'px', width:b.w+'px', height:b.h+'px' }); }
(() => {
  let d = null;
  $('#cBox').addEventListener('pointerdown', e => {
    e.preventDefault(); const h = e.target.dataset.h || 'move';
    d = { h, x:e.clientX, y:e.clientY, b:{...CR.box} }; $('#cBox').setPointerCapture(e.pointerId);
  });
  $('#cBox').addEventListener('pointermove', e => {
    if(!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y, b = {...d.b}, min = 40;
    const L = CR.ox, T = CR.oy, Rg = CR.ox + CR.iw, Bt = CR.oy + CR.ih;
    if(d.h === 'move'){ b.x = Math.max(L, Math.min(Rg - b.w, b.x + dx)); b.y = Math.max(T, Math.min(Bt - b.h, b.y + dy)); }
    else {
      if(d.h.includes('w')){ const nx = Math.max(L, Math.min(b.x + b.w - min, b.x + dx)); b.w += b.x - nx; b.x = nx; }
      if(d.h.includes('e')){ b.w = Math.max(min, Math.min(Rg - b.x, b.w + dx)); }
      if(d.h.includes('n')){ const ny = Math.max(T, Math.min(b.y + b.h - min, b.y + dy)); b.h += b.y - ny; b.y = ny; }
      if(d.h.includes('s')){ b.h = Math.max(min, Math.min(Bt - b.y, b.h + dy)); }
    }
    CR.box = b; drawCropBox();
  });
  const up = () => { d = null; };
  $('#cBox').addEventListener('pointerup', up); $('#cBox').addEventListener('pointercancel', up);
})();
function cropResult(){
  const b = CR.box, s = CR.scale;
  const sx = (b.x - CR.ox)/s, sy = (b.y - CR.oy)/s, sw = b.w/s, sh = b.h/s;
  const maxSide = 1100, k = Math.min(1, maxSide / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  c.getContext('2d').drawImage(CR.canvas, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return { src: c.toDataURL('image/jpeg', .84), ar: c.width / c.height };
}

/* ---------- zoom: pinch, double-tap, ctrl+wheel / trackpad, − / + buttons ---------- */
const Z = { pts:new Map(), pinch:null, pan:null, lastTap:0, pinched:false };
R.zoom = 1; R.panX = 0; R.panY = 0;
const zoomEl = $('#zoom'), wrapEl = $('#spreadWrap');
function clampPan(){
  const z = R.zoom, w = spread.offsetWidth * z, h = spread.offsetHeight * z;
  const mx = Math.max(0, (w - wrapEl.clientWidth)/2 + 30), my = Math.max(0, (h - wrapEl.clientHeight)/2 + 30);
  R.panX = Math.max(-mx, Math.min(mx, R.panX)); R.panY = Math.max(-my, Math.min(my, R.panY));
}
function applyZoom(anim){
  if(R.zoom <= 1.001){ R.zoom = 1; R.panX = 0; R.panY = 0; }
  clampPan();
  zoomEl.classList.toggle('anim', !!anim);
  zoomEl.style.transform = `translate(${R.panX}px, ${R.panY}px) scale(${R.zoom})`;
  reader.classList.toggle('zoomed', R.zoom > 1.01);
  $('#zVal').textContent = '%' + Math.round((R.mode === 'pdf' ? R.pz : R.zoom) * 100);
  sharpenSoon();
}
let shT; function sharpenSoon(){ clearTimeout(shT); shT = setTimeout(() => { document.querySelectorAll('#spread .page, #pdfView .page').forEach(paintInk); }, 260); }
// zoom by factor f around a screen point
function zoomAt(f, cx, cy, anim){
  if(R.mode === 'pdf'){ setPdfZoom(R.pz * f, cx, cy); return; }
  const r = wrapEl.getBoundingClientRect(), px = cx - (r.left + r.width/2), py = cy - (r.top + r.height/2);
  const z0 = R.zoom, z1 = Math.max(1, Math.min(4, z0 * f));
  R.panX = px - (px - R.panX) * (z1/z0); R.panY = py - (py - R.panY) * (z1/z0); R.zoom = z1;
  applyZoom(anim);
}
function resetZoom(){ R.zoom = 1; R.panX = 0; R.panY = 0; applyZoom(true); }
R.pz = 1;
function setPdfZoom(z, cx, cy){
  const v = $('#pdfView'), old = R.pz; z = Math.max(1, Math.min(3, z)); if(Math.abs(z - old) < .001) return;
  const r = v.getBoundingClientRect(), ox = (cx ?? r.left + r.width/2) - r.left, oy = (cy ?? r.top + r.height/2) - r.top;
  const fx = v.scrollLeft + ox, fy = v.scrollTop + oy;
  R.pz = z; v.style.setProperty('--pz', z);
  v.scrollLeft = fx * (z/old) - ox; v.scrollTop = fy * (z/old) - oy;
  $('#zVal').textContent = '%' + Math.round(z*100); sharpenSoon();
}
$('#zIn').onclick = () => { const r = wrapEl.getBoundingClientRect(); zoomAt(1.4, r.left + r.width/2, r.top + r.height/2, true); };
$('#zOut').onclick = () => { const r = wrapEl.getBoundingClientRect(); zoomAt(1/1.4, r.left + r.width/2, r.top + r.height/2, true); };

// pointer gestures on the book (capture phase, so they win over drawing and swiping)
wrapEl.addEventListener('pointerdown', e => {
  if(e.pointerType === 'touch' || e.pointerType === 'pen') Z.pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(e.pointerType === 'touch' && Z.pts.size === 2){
    const [a, b] = [...Z.pts.values()];
    Z.pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), mx:(a.x+b.x)/2, my:(a.y+b.y)/2 }; Z.pinched = true;
    cancelLiveStroke(); e.stopPropagation(); return;
  }
  // double-tap / double-click to zoom in or back out
  const now = Date.now();
  if(!R.pen && e.pointerType !== 'pen' && now - Z.lastTap < 300 && !e.target.closest('button,.sticker')){
    e.stopPropagation(); Z.lastTap = 0;
    if(R.zoom > 1.05) resetZoom(); else zoomAt(2.2, e.clientX, e.clientY, true);
    return;
  }
  Z.lastTap = now;
  // one-finger / mouse pan when zoomed and not writing
  if(R.zoom > 1.05 && !R.pen && !e.target.closest('button,.sticker,[data-goto],.st')){ Z.pan = { x:e.clientX, y:e.clientY, px:R.panX, py:R.panY, id:e.pointerId }; }
}, true);
wrapEl.addEventListener('pointermove', e => {
  if(Z.pts.has(e.pointerId)) Z.pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(Z.pinch && Z.pts.size >= 2){
    const [a, b] = [...Z.pts.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    R.panX += mx - Z.pinch.mx; R.panY += my - Z.pinch.my;
    zoomAt(d / Z.pinch.d, mx, my, false);
    Z.pinch = { d, mx, my }; e.stopPropagation(); return;
  }
  if(Z.pan && Z.pan.id === e.pointerId){ R.panX = Z.pan.px + e.clientX - Z.pan.x; R.panY = Z.pan.py + e.clientY - Z.pan.y; applyZoom(false); }

const zEnd = e => { Z.pts.delete(e.pointerId); if(Z.pts.size < 2) Z.pinch = null; if(Z.pan && Z.pan.id === e.pointerId) Z.pan = null; };

}
$('#modeSeg').onclick = e => { const b = e.target.closest('button'); if(!b) return; S.mode = b.dataset.mode; save(); applyMode();
  if(S.mode === 'auto') toast(new Date().getHours() >= 18 || new Date().getHours() < 6 ? 'Otomatik: saat 18:00\'i geçti, oda akşam modunda.' : 'Otomatik: oda 18:00\'de akşam moduna geçecek.'); };
function tick(){
  const d = new Date(); const m = d.getMinutes(), h = d.getHours() % 12;
  if(refs.hh){ refs.hh.rotation.z = -(h + m/60) * Math.PI/6; refs.mm.rotation.z = -m * Math.PI/30; dirty = true; }
  if(S.mode === 'auto') applyMode();
}

/* ---------- utils ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function hexRgb(h){ h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); }
function isDark(h){ const [r,g,b] = hexRgb(h); return (0.299*r + 0.587*g + 0.114*b) < 150; }
function shade(h, pct){ const [r,g,b] = hexRgb(h); const f = v => Math.max(0, Math.min(255, Math.round(v + v*pct/100))); return `rgb(${f(r)},${f(g)},${f(b)})`; }
let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3600); }

/* ---------- boot ---------- */
async function boot(){
  try{ await Promise.race([Promise.all([document.fonts.load('700 20px Figtree'), document.fonts.load('600 20px "Cormorant Garamond"')]), new Promise(r => setTimeout(r, 2500))]); }catch(_){}
  initThree(); makeMaterials(); buildRoom(); buildLights(); buildCase(); buildBooks();
  applyRoom(); applyMode(true); setLighting(app.dataset.mode === 'night', true);
  // realistic desk + paper for the reading view
  const deskURL = canvas(1024, 1024, (g,w,h) => drawWood(g, w, h, '#8a6444', '#3a2414', 23, 220)).toDataURL('image/jpeg', .85);
  reader.style.setProperty('--deskImg', `url(${deskURL})`);
  const paperURL = canvas(256, 256, (g,w,h) => { g.fillStyle = '#fbf7ef'; g.fillRect(0,0,w,h); noise(g, w, h, 9, 3); }).toDataURL();
  app.style.setProperty('--paperImg', `url(${paperURL})`);
  const intro = viewParams('room'); camTarget.copy(intro.tgt);
  camera.position.copy(intro.pos).add(new V3(1.2, 0.6, -1.4)); camera.lookAt(camTarget);
  setView('room', false, 1400);
  requestAnimationFrame(loop);
  tick(); setInterval(tick, 20000);
  $('#loading').hidden = true;
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if(!renderer) return;
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  setView(view, true); if(R.book && R.mode === 'book') renderAll();
}, 120); });
if(location.hash === '#aksam'){ S.mode = 'night'; }
boot();
})();
</script>
