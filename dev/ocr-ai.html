<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>OCR AI deneme</title>
    <!-- 6.4b-AI: dev only. Not a build input (vite.config.ts builds index.html only), so it never ships. -->
    <style>
      :root { color-scheme: light; --zemin: #f6f3ee; --kart: #fff; --cizgi: #d9d2c5; --yazi: #1d232b; --soluk: #5d6670; --vurgu: #2f5d8a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--zemin); color: var(--yazi); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 0 0 8px; color: var(--soluk); text-transform: uppercase; letter-spacing: .04em; }
      section { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
      .satirlar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
      .not { color: var(--soluk); margin: 6px 0; }
      .gizli { display: none; }
      button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--cizgi); background: #fff; cursor: pointer; min-height: 40px; }
      button.ana { background: var(--vurgu); color: #fff; border-color: var(--vurgu); }
      button:disabled { opacity: .45; cursor: default; }
      .donus button { min-width: 52px; margin-right: 4px; }
      .donus button[aria-pressed="true"] { background: #e3ecf5; border-color: var(--vurgu); }
      input[type=number] { width: 64px; font: inherit; }
      input[type=file] { max-width: 100%; }
      textarea { width: 100%; font: inherit; }
      #onizleme { display: block; max-width: 100%; max-height: 420px; object-fit: contain; margin-top: 8px; border: 1px solid var(--cizgi); }
      #onizleme:not([src]) { display: none; }
      .durum { min-height: 1.5em; margin: 8px 0 0; }
      .kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
      .kart { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 10px; padding: 12px 14px; min-width: 0; }
      .kart h3 { margin: 0 0 8px; }
      .olcum { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0 0 10px; font-size: 13px; }
      .olcum dt { color: var(--soluk); }
      .olcum dd { margin: 0; overflow-wrap: anywhere; }
      .sayfa { border-top: 1px dashed var(--cizgi); padding-top: 8px; font-size: 15px; }
      .satir { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.4em; }
      .tur-formul { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: #f3f1fa; border-radius: 4px; margin: 2px 0; }
      .parca.tur-formul { display: inline-block; padding: 0 4px; }
      .duzeltme { color: var(--soluk); font-size: 12px; margin-left: 4px; text-decoration: none; display: inline-block; }
      .tur-cizim { font-style: italic; }
      .ustu-cizili { text-decoration: line-through; }
      mark { background: #ffe58a; color: inherit; border-radius: 3px; }
      .hata { color: #b03a2e; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
      @media (max-width: 600px) { .kartlar { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/ocrAi/deneme.ts"></script>
  </body>
</html>
